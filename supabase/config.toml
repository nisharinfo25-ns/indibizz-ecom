# IndiaBizz Supabase local/staging configuration.
# Remote deployment: `supabase link --project-ref <ref>` then `supabase db push`
# and `supabase functions deploy` for each function below.
project_id = "indibizz"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
# Templates are configured in the Supabase dashboard for remote projects.
# Twilio (or another supported provider) credentials must exist there.

[storage]
enabled = true
file_size_limit = "20MiB"

[realtime]
enabled = true

[functions.request-otp]
verify_jwt = false

[functions.bootstrap-owner]
verify_jwt = false

[functions.generate-document]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false

[functions.assignment-expiry-worker]
verify_jwt = false

[functions.health]
verify_jwt = false
